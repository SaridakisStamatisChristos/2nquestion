name: Stage 33 sharp two-recipient zero-privacy theorem
on:
  push:
    paths:
      - 'research/v5.0/**'
      - '.github/workflows/research-v50.yml'
  pull_request:
    paths:
      - 'research/v5.0/**'
      - '.github/workflows/research-v50.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-recipient-exact-threshold:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify all-size (a,b,2) construction and exact n22/n23 incidence counts
        run: python3 -B research/v5.0/two_recipient_zero_privacy.py
      - name: Independent Stage32 all-original-chronology rooted-center transfer
        run: python3 -B research/v4.9/center_root_bootstrap.py
      - name: Independent sharp Stage29 (1,1,c) privacy theorem
        run: python3 -B research/v4.6/private_threshold.py
      - name: Independent Stage30 exact original double-path crossing support
        run: python3 -B research/v4.7/double_path_rigidity.py
