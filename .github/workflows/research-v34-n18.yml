name: Stage 17B n18 original chronology half-forest exact finite gates
on:
  push:
    paths:
      - 'research/v3.4/exact_eight_group_orbits.cpp'
      - 'research/v3.4/check_five_person_and_n18.py'
      - 'research/v3.4/N18_ORIGINAL_CHRONOLOGY_THEOREM.md'
      - '.github/workflows/research-v34-n18.yml'
  pull_request:
    paths:
      - 'research/v3.4/exact_eight_group_orbits.cpp'
      - 'research/v3.4/check_five_person_and_n18.py'
      - 'research/v3.4/N18_ORIGINAL_CHRONOLOGY_THEOREM.md'
      - '.github/workflows/research-v34-n18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-eight-and-private:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exhaustively replay 366654960 symmetry-reduced chronological local 8-person histories
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v3.4/exact_eight_group_orbits.cpp -o /tmp/exact_eight_group_orbits
          /tmp/exact_eight_group_orbits
      - name: Independently verify five-person privacy and all n18 labelled 3x3 matrices
        run: |
          python3 -B research/v3.4/check_five_person_and_n18.py
      - name: Regress Stage16B exact smaller local chronological histories and eight-person witness
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v3.3/exact_local_double_cover.cpp -o /tmp/exact_local_double_cover
          /tmp/exact_local_double_cover
      - name: Regress Stage15 helper-cover equality and Stage13 temporal crossing
        run: |
          python3 -B research/v3.2/equality_helper_probe.py
          python3 -B research/v3.0/check_center_saturation.py
