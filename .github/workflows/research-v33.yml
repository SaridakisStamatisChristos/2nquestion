name: Stage 16 root-assisted four-arm chronological mixed 3x3
on:
  push:
    paths:
      - 'research/v3.3/**'
      - '.github/workflows/research-v33.yml'
  pull_request:
    paths:
      - 'research/v3.3/**'
      - '.github/workflows/research-v33.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-mixed-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Independently compute exact mixed 3x3 incidence survivors and verify rooted five-group equality boundary
        run: python3 -B research/v3.3/count_mixed_arm_profiles.py
      - name: Regress Stage 15 Steiner helper equality and original chronology crossing
        run: |
          python3 -B research/v3.2/equality_helper_probe.py
          python3 -B research/v3.0/check_center_saturation.py
      - name: Regress Stage 14 four-collector causal bridge
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v3.1/exhaustive_four_collector.cpp -o /tmp/stage16_four_collector
          /tmp/stage16_four_collector
