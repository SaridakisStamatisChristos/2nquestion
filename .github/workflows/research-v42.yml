name: Stage 25 original n21 conservative 77-profile frontier
on:
  push:
    paths:
      - 'research/v4.2/**'
      - '.github/workflows/research-v42.yml'
  pull_request:
    paths:
      - 'research/v4.2/**'
      - '.github/workflows/research-v42.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-incidence-n21:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Regenerate original chronological n20 and n21 necessary 3x3 profile counts and row-column symmetry orbits
        run: python3 -B research/v4.2/n21_staged_frontier.py
      - name: Independently verify central root cut and four-group chronological tree lower bound
        run: python3 -B research/v3.7/stage20_root_cut_probe.py
      - name: Independently regress original n20 last-five incidence orbits and their exclusion
        run: python3 -B research/v4.0/count_n20_final.py
      - name: Independently verify Stage24 causally sealed arm three-star occupancy
        run: python3 -B research/v4.1/check_three_star_occupancy.py
