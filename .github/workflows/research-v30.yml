name: Stage 13 two-carrier crossing and 3x3 center saturation
on:
  push:
    paths:
      - 'research/v3.0/**'
      - '.github/workflows/research-v30.yml'
  pull_request:
    paths:
      - 'research/v3.0/**'
      - '.github/workflows/research-v30.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-carrier-and-center:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exhaustive independent two-point temporal crossing and collector budget
        run: python3 -B research/v3.0/check_center_saturation.py
      - name: Replay sharp one-root, two-root and unicyclic two-fold cover chronologies
        run: python3 -B research/v3.0/construct_saturated_center.py
