name: Stage 20 n19 original half-forest proof independent exact gates
on:
  push:
    paths:
      - 'research/v3.7/**'
      - '.github/workflows/research-v37-n19-completion.yml'
  pull_request:
    paths:
      - 'research/v3.7/**'
      - '.github/workflows/research-v37-n19-completion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-n19-proof-obligations:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Independent n6 original chronological tree three-leaf star exhaustiveness
        run: |
          python3 -B research/v3.7/exact_three_leaf_star.py
      - name: Positive local n9 three-collector boundary and three target-support pairs
        run: |
          python3 -B research/v3.7/local_nine_collector_boundary.py
      - name: Independently exhaustive n19 small tree privacy tables and 41 to 4 incidence rejection
        run: |
          python3 -B research/v3.6/exact_small_tree_privacy.py
          python3 -B research/v3.6/count_n19_privacy_profiles.py
      - name: Independent n7 four-leaf star regression from Stage18
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v3.5/exact_tree_star_crossing.cpp -o /tmp/exact_tree_star_crossing
          /tmp/exact_tree_star_crossing
      - name: Recheck exact two-person temporal crossing
        run: |
          python3 -B research/v3.0/check_center_saturation.py
