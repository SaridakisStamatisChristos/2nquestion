name: Stage 8 all-n collector budget falsification
on:
  push:
    paths:
      - 'research/v2.5/**'
      - '.github/workflows/research-v25.yml'
  pull_request:
    paths:
      - 'research/v2.5/**'
      - '.github/workflows/research-v25.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  small-components:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Independent exhaustive distinct-contact knowledge-state simulation
        run: python3 -B research/v2.5/check_collector_budget.py
      - name: Exhaustive original-half rank-preserving two-call extension audit
        run: python3 -B research/v2.5/test_fringe_extension.py
