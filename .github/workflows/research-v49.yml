name: Stage 32 universal center-root bootstrap
on:
  push:
    paths:
      - 'research/v4.9/**'
      - '.github/workflows/research-v49.yml'
  pull_request:
    paths:
      - 'research/v4.9/**'
      - '.github/workflows/research-v49.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-root-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exhaust original local n4/n5 unicyclic histories, all partitions, n22/n23 exact incidence
        run: python3 -B research/v4.9/center_root_bootstrap.py
      - name: Independent n22 Stage31 collector-transfer and weaker incidence census
        run: python3 -B research/v4.8/last_contact_transfer.py
      - name: Original Stage28 all-n exterior full-collector obstruction
        run: python3 -B research/v4.5/unbounded_eight_outside_audit.py
      - name: Sharp all-c private-recipient proof regression
        run: python3 -B research/v4.6/private_threshold.py
