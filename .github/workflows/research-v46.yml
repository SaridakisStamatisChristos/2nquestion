name: Stage 29 exact all-n 1-1-c chronological private threshold
on:
  push:
    paths:
      - 'research/v4.6/**'
      - '.github/workflows/research-v46.yml'
  pull_request:
    paths:
      - 'research/v4.6/**'
      - '.github/workflows/research-v46.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-tree-private-threshold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Independent (1,1,c) Prüfer enumeration and exact infinite-family witness regressions
        run: python3 -B research/v4.6/private_threshold.py
      - name: Existing n<=7 original chronological privacy regressions (C++ independent oracle)
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v3.8/exact_seven_tree_privacy.cpp -o /tmp/stage29_tree_privacy
          /tmp/stage29_tree_privacy
      - name: Existing private/equality-with-helpers independent chronological oracle
        run: python3 -B research/v3.2/equality_helper_probe.py
      - name: Original n22 all-n eight-outside incidence frontier regression
        run: python3 -B research/v4.5/unbounded_eight_outside_audit.py
