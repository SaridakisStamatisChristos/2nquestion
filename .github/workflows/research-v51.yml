name: Stage 34 n22 original chronological half forest complete incidence audit
on:
  push:
    paths:
      - 'research/v5.1/**'
      - '.github/workflows/research-v51.yml'
  pull_request:
    paths:
      - 'research/v5.1/**'
      - '.github/workflows/research-v51.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-n22-human-lemma-dependent-census:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exact original n22 24310-matrix reason partition and cross-half support hypotheses
        run: python3 -B research/v5.1/n22_final_center_support.py
      - name: Independent immutable seven-orbit final n22 certificate, all size/root and support premises
        run: python3 -B research/v5.1/seven_orbit_certificate.py
      - name: Re-audit ALL-n original rooted-center transfer 4/5-person exhaustive chronological falsifiers
        run: python3 -B research/v4.9/center_root_bootstrap.py
      - name: Re-audit helper-robust two-recipient zero-privacy sharp constructions
        run: python3 -B research/v5.0/two_recipient_zero_privacy.py
      - name: Re-audit sharp tree zero privacy threshold all c with independent chronological cases
        run: python3 -B research/v4.6/private_threshold.py
      - name: Re-audit original six-center double-path exact support families
        run: python3 -B research/v4.7/double_path_rigidity.py
      - name: Re-audit Stage 28 center collector human proof boundary falsifiers
        run: python3 -B research/v4.5/unbounded_eight_outside_audit.py
      - name: Re-audit Stage 27 independent baseline and original Stage25/26 differential classifiers
        run: python3 -B research/v4.4/n22_3x3_frontier.py
      - name: Re-audit Stage 26 original n21 fixed-half closure
        run: python3 -B research/v4.3/n21_final.py
