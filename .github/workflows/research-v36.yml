name: Stage 19 unrestricted original 3x3 central-private collector capacity
on:
  push:
    paths:
      - 'research/v3.6/**'
      - '.github/workflows/research-v36.yml'
  pull_request:
    paths:
      - 'research/v3.6/**'
      - '.github/workflows/research-v36.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-center-private-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Independent local unicyclic 10-person replay and exact support-family capacity
        run: python3 -B research/v3.6/central_private_capacity_check.py
      - name: Regress unrestricted Stage 17 offcorner double carriers
        run: python3 -B research/v3.4/double_carrier_support_falsifier.py
      - name: Regress Stage 18 sharp six-group chronological tree
        run: python3 -B research/v3.5/six_group_bridge_check.py
