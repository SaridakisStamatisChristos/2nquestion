name: Stage 18 six-group tree cover and n43 mixed original chronology obstruction
on:
  push:
    paths:
      - 'research/v3.5/**'
      - '.github/workflows/research-v35.yml'
  pull_request:
    paths:
      - 'research/v3.5/**'
      - '.github/workflows/research-v35.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-six-group-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Independent 32-person six-group chronological tree and exact n13-n26 incidence enumerations
        run: python3 -B research/v3.5/six_group_bridge_check.py
      - name: Independently regress original 3x3 four-cell two-carrier supports
        run: python3 -B research/v3.4/double_carrier_support_falsifier.py
      - name: Independently regress Stage 15 equality rigidity WITH unused helper vertices
        run: python3 -B research/v3.2/equality_helper_probe.py
