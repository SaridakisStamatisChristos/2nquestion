name: Stage 10 four-arm crossing theorem adversarial evidence
on:
  push:
    paths:
      - 'research/v2.7/**'
      - '.github/workflows/research-v27.yml'
  pull_request:
    paths:
      - 'research/v2.7/**'
      - '.github/workflows/research-v27.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-arm-crossing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reproduce exact small t=4,5 B/D and constructive local t=60 boundary
        run: python3 -B research/v2.7/crossing_barrier_check.py
