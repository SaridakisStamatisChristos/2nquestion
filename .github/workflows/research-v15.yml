name: Verify Labahn minimal-order bridge audit

on:
  push:
    paths:
      - 'research/v1.5/**'
      - '.github/workflows/research-v15.yml'
  pull_request:
    paths:
      - 'research/v1.5/**'
      - '.github/workflows/research-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poset-exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enumerate 8-vertex poset and verify 13-vertex extension
        run: python3 research/v1.5/minimal_order_bridge.py
      - name: Check corrected 13-vertex structural filter
        run: python3 research/v1.4/half_forest13_reduction.py
