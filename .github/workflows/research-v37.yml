name: Stage 20 central private root cut and ten outside participants
on:
  push:
    paths:
      - 'research/v3.7/**'
      - '.github/workflows/research-v37.yml'
  pull_request:
    paths:
      - 'research/v3.7/**'
      - '.github/workflows/research-v37.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-root-cut:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exhaustively falsify four disjoint complete recipient groups below eight participants
        run: python3 -B research/v3.7/stage20_root_cut_probe.py
      - name: Recheck Stage 19 exact center singleton carrier capacity and chronology countermodels
        run: python3 -B research/v3.6/central_private_capacity_check.py
      - name: Recheck unrestricted Stage 17 exact offcorner double-carrier logic
        run: python3 -B research/v3.4/double_carrier_support_falsifier.py
      - name: Recheck helper-robust tree-cover equality rigidity
        run: python3 -B research/v3.2/equality_helper_probe.py
