name: Stage 6 general conjecture structural and priority audit
on:
  push:
    paths:
      - 'research/v2.3/**'
      - '.github/workflows/research-v23.yml'
  pull_request:
    paths:
      - 'research/v2.3/**'
      - '.github/workflows/research-v23.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontier-and-ideals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Independent n17 rectangular and 3x3 frontier
        run: python3 research/v2.3/n17_structural.py
      - name: Exact balanced ideals and classical-kernel scope
        run: python3 research/v2.3/balanced_ideal_audit.py
