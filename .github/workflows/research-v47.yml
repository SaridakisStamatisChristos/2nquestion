name: Stage 30 all-n six-recipient double-path crossing rigidity
on:
  push:
    paths:
      - 'research/v4.7/**'
      - '.github/workflows/research-v47.yml'
  pull_request:
    paths:
      - 'research/v4.7/**'
      - '.github/workflows/research-v47.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-rigidity-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exact n4-n6 rooted chronological trees with helper vertices plus full 90x90 crossing audit
        run: python3 -B research/v4.7/double_path_rigidity.py
      - name: Target original n22/n23 exact six-cell source-target support cases without claiming UNSAT
        run: python3 -B research/v4.7/n22_double_path_targets.py
      - name: Independent sharp (1,1,c) group privacy theorem and chronological constructions
        run: python3 -B research/v4.6/private_threshold.py
      - name: Original tree private recipient and helper-equality independent C++ source
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v3.8/exact_seven_tree_privacy.cpp -o /tmp/stage30_privacy_cpp
          /tmp/stage30_privacy_cpp
      - name: Original three-star chronological crossing regression
        run: python3 -B research/v3.7/exact_three_leaf_star.py
