name: Stage 12 no-tight-arm theorem and adversarial private-recipient boundary
on:
  push:
    paths:
      - 'research/v2.9/**'
      - '.github/workflows/research-v29.yml'
  pull_request:
    paths:
      - 'research/v2.9/**'
      - '.github/workflows/research-v29.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-rooted-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Independently enumerate all n4,n5,n6 rooted tree calls and private-member patterns
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v2.9/no_tight_arm_probe.cpp -o /tmp/no_tight_arm_probe
          /tmp/no_tight_arm_probe
      - name: Audit all 51200 W8 linear extensions against Bumby closed-tree first and last spine
        run: python3 -B research/v2.9/check_bumby_w8_spine.py
