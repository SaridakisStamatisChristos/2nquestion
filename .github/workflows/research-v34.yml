name: Stage 17 unrestricted original 3x3 double-carrier invariant
on:
  push:
    paths:
      - 'research/v3.4/**'
      - '.github/workflows/research-v34.yml'
  pull_request:
    paths:
      - 'research/v3.4/**'
      - '.github/workflows/research-v34.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-cell-private-support-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Independent exhaustive support families on 2 and 3 midpoint persons
        run: python3 -B research/v3.4/double_carrier_support_falsifier.py
      - name: Regress Stage 16 root-assisted and double-carrier-based collector implications
        run: python3 -B research/v3.3/count_mixed_arm_profiles.py
      - name: Regress precise original chronological two-point crossing
        run: python3 -B research/v3.0/check_center_saturation.py
