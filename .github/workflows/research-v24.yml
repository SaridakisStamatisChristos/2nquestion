name: Stage 7 universal incidence-surplus theorem adversarial checks
on:
  push:
    paths:
      - 'research/v2.4/**'
      - '.github/workflows/research-v24.yml'
  pull_request:
    paths:
      - 'research/v2.4/**'
      - '.github/workflows/research-v24.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  universal-surplus-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enumerate and falsify six distinct all-n theorem boundary shapes
        run: python3 -B research/v2.4/prove_universal_surplus_gap.py
      - name: Compile and independently falsify symmetric all-n bound via every binary cell mask
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v2.4/test_symmetric_surplus.cpp -o /tmp/symmetric_surplus
          /tmp/symmetric_surplus
      - name: Falsify naive universal degree-two deletion premise
        run: python3 -B research/v2.4/adversarial_induction_obstruction.py
