name: Stage 24 k-arm causal three-star occupancy and exact chronological support
on:
  push:
    paths:
      - 'research/v4.1/**'
      - '.github/workflows/research-v41.yml'
  pull_request:
    paths:
      - 'research/v4.1/**'
      - '.github/workflows/research-v41.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-arm-occupancy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exhaust all k3-k8 positive recipient arm occupancy configurations
        run: python3 -B research/v4.1/check_three_star_occupancy.py
      - name: Original chronological exact independent 3-star and 4-star tree adversarial checks
        run: |
          python3 -B research/v3.7/exact_three_leaf_star.py
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v4.0/exact_seven_tree_four_star.cpp -o /tmp/original_star_oracle
          /tmp/original_star_oracle
      - name: Recheck original n20 five-orbit contradiction
        run: python3 -B research/v4.0/count_n20_final.py
