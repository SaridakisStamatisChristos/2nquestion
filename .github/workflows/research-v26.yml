name: Stage 9 exponential chronological tree-cover theorem
on:
  push:
    paths:
      - 'research/v2.6/**'
      - '.github/workflows/research-v26.yml'
  pull_request:
    paths:
      - 'research/v2.6/**'
      - '.github/workflows/research-v26.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tree-cover-exponential:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile and exhaustively attack 4-group tree-cover below 8 vertices
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v2.6/check_tree_cover_small.cpp -o /tmp/tree_cover_bruteforce
          /tmp/tree_cover_bruteforce
      - name: Check recursive equality constructions for s 1 through 8
        run: python3 -B research/v2.6/construct_tree_cover_equality.py
      - name: Exhaustive fixed-midpoint straddling and all successful insertion slots
        run: python3 -B research/v2.6/check_midpoint_straddling.py
      - name: Falsify uniform two-participant n18 3x3 candidate with exact B/D histories
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v2.6/probe_n18_uniform_two.cpp -o /tmp/n18_uniform_two
          /tmp/n18_uniform_two
