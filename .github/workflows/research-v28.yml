name: Stage 11 exact tree-cover equality and crossed-arm rigidity
on:
  push:
    paths:
      - 'research/v2.8/**'
      - '.github/workflows/research-v28.yml'
  pull_request:
    paths:
      - 'research/v2.8/**'
      - '.github/workflows/research-v28.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  robust-cover-and-crossing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test helper-robust lower bound and private-secret equality rigidity independently
        run: python3 -B research/v2.8/rigid_cover_check.py
