name: Stage 14 causal four-arm bridge independent falsification
on:
  push:
    paths:
      - 'research/v3.1/**'
      - '.github/workflows/research-v31.yml'
  pull_request:
    paths:
      - 'research/v3.1/**'
      - '.github/workflows/research-v31.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-causal-arms:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exhaustive all connected n4,n5,n6 unicyclic orderings and collector reconstruction
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v3.1/exhaustive_four_collector.cpp -o /tmp/exhaustive_four_collector
          /tmp/exhaustive_four_collector
      - name: Recheck independent two-carrier temporal crossing and 16-person countermodel to strict order
        run: |
          python3 -B research/v3.0/check_center_saturation.py
          python3 -B research/v3.0/construct_saturated_center.py
