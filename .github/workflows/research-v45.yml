name: Stage 28 all-n eight-outside collector proof falsification
on:
  push:
    paths:
      - 'research/v4.5/**'
      - '.github/workflows/research-v45.yml'
  pull_request:
    paths:
      - 'research/v4.5/**'
      - '.github/workflows/research-v45.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-collector-generalization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate all-n arithmetic prerequisites and n22/23 generalization
        run: python3 -B research/v4.5/unbounded_eight_outside_audit.py
      - name: Independently rerun n21/n22 3x3 original-order incidence reference
        run: python3 -B research/v4.4/n22_3x3_frontier.py
      - name: Independently audit Stage24 collector-root occupancy implication
        run: python3 -B research/v4.1/check_three_star_occupancy.py
      - name: Independently audit helper-equality private-secret boundary
        run: python3 -B research/v3.2/equality_helper_probe.py
      - name: Independently audit original three-star prohibition
        run: python3 -B research/v3.7/exact_three_leaf_star.py
      - name: Independently audit original triple-recipient tree double-cover lemma
        run: python3 -B research/v3.6/central_private_capacity_check.py
