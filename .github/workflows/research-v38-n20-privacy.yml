name: Stage 21 exact n20 chronological tree privacy and incidence-orbit frontier
on:
  push:
    paths:
      - 'research/v3.8/**'
      - '.github/workflows/research-v38-n20-privacy.yml'
  pull_request:
    paths:
      - 'research/v3.8/**'
      - '.github/workflows/research-v38-n20-privacy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-n20-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exhaustively enumerate all additional six-seven-person original chronological private recipient histories
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v3.8/exact_seven_tree_privacy.cpp -o /tmp/exact_seven_tree_privacy
          /tmp/exact_seven_tree_privacy
      - name: Independently enumerate all 6435 n20 3x3 matrices and reduce to 13 orbit representatives
        run: |
          python3 -B research/v3.8/count_n20_privacy_orbits.py
      - name: Recheck Stage19 all four-five-six-person exact privacy histogram boundary cases
        run: |
          python3 -B research/v3.6/exact_small_tree_privacy.py
      - name: Regress independent Stage20 original six-person chronological star contradiction
        run: |
          python3 -B research/v3.7/exact_three_leaf_star.py
