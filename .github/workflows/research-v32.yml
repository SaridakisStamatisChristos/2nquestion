name: Stage 15 helper equality rigidity and one-sided 3x3 original chronology
on:
  push:
    paths:
      - 'research/v3.2/**'
      - '.github/workflows/research-v32.yml'
  pull_request:
    paths:
      - 'research/v3.2/**'
      - '.github/workflows/research-v32.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helper-equality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Independently enumerate all labelled chronological trees n2-n5 and equality covers with unused helpers
        run: python3 -B research/v3.2/equality_helper_probe.py
      - name: Regression of the original chronological two-point compatibility theorem
        run: python3 -B research/v3.0/check_center_saturation.py
      - name: Independently count every relaxed 3x3 integer incidence n18-n25 and verify inclusion exclusion
        run: python3 -B research/v3.2/count_3x3_incidence.py
