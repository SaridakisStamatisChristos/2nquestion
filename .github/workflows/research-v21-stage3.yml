name: Stage 3 independent n15 adversarial audit
on:
  push:
    paths:
      - 'research/v2.1/**'
      - '.github/workflows/research-v21-stage3.yml'
  pull_request:
    paths:
      - 'research/v2.1/**'
      - '.github/workflows/research-v21-stage3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  second-seven-vertex-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rebuild two independent C++17 oracles and compare full domains
        run: python3 research/v2.1/stage3_adversarial_check.py
