name: Stage 26 n21 ORIGINAL chronological half-forest finite closure
on:
  push:
    paths:
      - 'research/v4.3/**'
      - '.github/workflows/research-v43.yml'
  pull_request:
    paths:
      - 'research/v4.3/**'
      - '.github/workflows/research-v43.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-n21-original-order:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exact 12870-matrix n21 census and 77-to-zero original-order necessary conditions
        run: |
          python3 -B research/v4.2/n21_staged_frontier.py
          python3 -B research/v4.3/n21_final.py
      - name: Independent six-person original-last-edge three-star exhaustive chronology checker
        run: python3 -B research/v3.7/exact_three_leaf_star.py
      - name: Independent all-n-lemma boundary occupancy enumeration k3 to k8
        run: python3 -B research/v4.1/check_three_star_occupancy.py
      - name: Independently regenerate n20 earlier last-five incidence orbit closure
        run: python3 -B research/v4.0/count_n20_final.py
      - name: Independently replay chronological tree n4-n5 helper equality/private witnesses
        run: python3 -B research/v3.2/equality_helper_probe.py
      - name: Independent n19 n20 tree privacy histogram regression n6/n7
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v3.8/exact_seven_tree_privacy.cpp -o /tmp/n21_privacy_independent
          /tmp/n21_privacy_independent
