name: Stage 23 original chronological n20 half-forest proof obligation
on:
  push:
    paths:
      - 'research/v4.0/**'
      - '.github/workflows/research-v40.yml'
  pull_request:
    paths:
      - 'research/v4.0/**'
      - '.github/workflows/research-v40.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  n20-independent-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Independent seven-person original-tree four-leaf star exhaustive chronology
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/v4.0/exact_seven_tree_four_star.cpp -o /tmp/exact_seven_tree_four_star
          /tmp/exact_seven_tree_four_star
      - name: Independently regenerate all 20 n20 Stage22 profiles and check five-orbit collector contradiction
        run: python3 -B research/v4.0/count_n20_final.py
      - name: Replay separate stage 20 original six-person three-leaf star and stage 22 incidence oracle
        run: |
          python3 -B research/v3.7/exact_three_leaf_star.py
          python3 -B research/v3.9/count_n20_three_star.py
      - name: Recheck stage 13 sharp two-outside-root tree double cover
        run: python3 -B research/v3.0/construct_saturated_center.py
